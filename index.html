<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        :root {
            --bg: #0d1117;
            --accent: #58a6ff;
            --text: #c9d1d9;
            --card-bg: #161b22;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            cursor: pointer;
        }

        p { font-size: 0.9rem; opacity: 0.8; }

        .links {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            font-size: 1.2rem;
        }

        .icon {
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
        }

        .icon:hover { transform: scale(1.3) rotate(15deg); }

        .gear {
            display: inline-block;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
      
        #game-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .target {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, red, red 20px, white 20px, white 40px);
            position: relative;
            cursor: crosshair;
        }

        .score { font-size: 2rem; margin-bottom: 20px; color: var(--accent); }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
            opacity: 0.1;
        }

        .hidden-terminal {
            display: none;
            background: black;
            color: #0f0;
            padding: 10px;
            margin-top: 15px;
            font-size: 0.8rem;
            border: 1px solid #0f0;
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="card" id="main-card">
    <h1 onclick="toggleTerminal()">> USER: ADMIN_</h1>
    <p>Fullstack Developer | Mechanical Engineer</p>
    <hr style="border: 0.5px solid #30363d">
    
    <div class="links">
        <span class="icon" title="Запустить Matrix" onclick="startMatrix()">💾</span>
        <span class="icon gear" title="Инженерия">⚙️</span>
        <span class="icon" title="Играть в дартс" onclick="toggleDarts()">🎯</span>
        <span class="icon" onclick="alert('There is nothing')">✉️</span>
    </div>

    <div id="terminal" class="hidden-terminal">
        root@system:~$ <span id="cmd-text"></span>
    </div>
</div>

<div id="game-overlay" onclick="if(event.target === this) toggleDarts()">
    <div class="score">Счет: <span id="points">0</span></div>
    <div class="target" id="dart-target"></div>
    <p style="color: white; margin-top: 20px;">Click in the center! (Click on the background to exit)</p>
</div>

<script>
    function toggleTerminal() {
        const term = document.getElementById('terminal');
        const text = document.getElementById('cmd-text');
        term.style.display = term.style.display === 'block' ? 'none' : 'block';
        if(term.style.display === 'block') {
            text.innerHTML = "Initializing neural link...";
            setTimeout(() => { text.innerHTML = "Access granted. Welcome, Engineer."; }, 1500);
        }
    }

    let score = 0;
    function toggleDarts() {
        const overlay = document.getElementById('game-overlay');
        overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
    }

    document.getElementById('dart-target').addEventListener('mousedown', function(e) {
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left - 100;
        const y = e.clientY - rect.top - 100;
        const dist = Math.sqrt(x*x + y*y);
        
        if (dist < 20) score += 100;
        else if (dist < 60) score += 50;
        else score += 10;
        
        document.getElementById('points').innerText = score;
        
        this.style.transform = 'scale(0.95)';
        setTimeout(() => this.style.transform = 'scale(1)', 100);
    });

    function startMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>[]{}/";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px arial';
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
        document.getElementById('matrix-canvas').style.opacity = "1";
    }
</script>

</body>
</html>
